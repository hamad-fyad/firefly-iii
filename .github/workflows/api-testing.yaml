          # Copy dependency reports if they exist
          if [ -d "dependency-reports-downloaded" ]; then
            for dir in dependency-reports-downloaded/*/; do
              if [ -d "$dir" ]; then
                cp -r "$dir"* pages-content/dependency-reports/ 2>/dev/null || true
              fi
            done
