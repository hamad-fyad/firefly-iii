                  pre { background: #f8f9fa; padding: 15px; border-radius: 6px; overflow-x: auto; border-left: 4px solid #e74c3c; }
                  code { background: #f8f9fa; padding: 2px 5px; border-radius: 3px; font-family: 'Monaco', 'Consolas', monospace; }
                  ul { margin: 15px 0; padding-left: 30px; }
                  li { margin: 8px 0; }
                  .back-link { display: inline-block; margin-bottom: 20px; padding: 10px 15px; background: #3498db; color: white; text-decoration: none; border-radius: 6px; }
                  .back-link:hover { background: #2980b9; }
              </style>
          </head>
          <body>
              <div class="container">
                  <a href="../" class="back-link">← Back to Dashboard</a>
                  <div id="content">
          EOF
              
              # Convert markdown content to basic HTML structure
              sed -e 's/^# /\<h1\>/g' \
                  -e 's/^## /\<h2\>/g' \
                  -e 's/^### /\<h3\>/g' \
                  -e 's/\*\*\([^*]*\)\*\*/\<strong\>\1\<\/strong\>/g' \
                  -e 's/`\([^`]*\)`/\<code\>\1\<\/code\>/g' \
                  -e 's/^⚠️.*$/\<div class="warning"\>&\<\/div\>/g' \
                  -e 's/^✅.*$/\<div class="success"\>&\<\/div\>/g' \
                  -e 's/^❌.*$/\<div class="error"\>&\<\/div\>/g' \
                  -e 's/^ℹ️.*$/\<div class="info"\>&\<\/div\>/g' \
                  -e 's/^- /\<li\>/g' \
                  -e 's/$/\<br\>/g' \
                  pages-content/security-reports/security-summary.md >> pages-content/security-reports/security-summary.html
              
              cat >> pages-content/security-reports/security-summary.html << 'EOF'
                  </div>
              </div>
          </body>
          </html>
          EOF
              
              echo "✅ Security summary HTML created successfully"
            fi
          fi
          
          # Copy quality reports if they exist
          if [ -d "quality-reports-downloaded" ]; then
            for dir in quality-reports-downloaded/*/; do
              if [ -d "$dir" ]; then
                cp -r "$dir"* pages-content/code-quality/ 2>/dev/null || true
              fi
            done
          fi
          
          # Copy load test reports if they exist
          if [ -d "load-reports-downloaded" ]; then
            for dir in load-reports-downloaded/*/; do
              if [ -d "$dir" ]; then
                cp -r "$dir"* pages-content/load-tests/ 2>/dev/null || true
              fi
